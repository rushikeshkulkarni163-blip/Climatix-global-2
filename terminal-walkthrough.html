<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>Climactix Terminal — Live Walkthrough · Climactix Global</title>
<meta name="description" content="Interactive walkthrough of the Climactix Terminal: corporate sustainability disclosures, an explainable intelligence score, a report repository, and views for banks, insurers, investors and government. Demonstration data." />
<link rel="icon" type="image/png" sizes="32x32" href="Climatix_logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>(function(){var t='light';try{if(localStorage.getItem('cx-terminal-theme')==='dark')t='dark';}catch(e){}if(t==='light')document.documentElement.setAttribute('data-theme','light');})();</script>
<link rel="stylesheet" href="terminal-walkthrough.css?v=4" />
</head>
<body>

<div class="tw-app" id="tw-app">

  <aside class="tw-rail" id="tw-rail" aria-label="Terminal modules">
    <div class="tw-brand">
      <img src="Climatix_logo.png" alt="Climactix Global" />
      <div class="tw-brand-txt"><b>Climactix Terminal</b>Live walkthrough</div>
    </div>
    <nav class="tw-nav" id="tw-nav" aria-label="Walkthrough modules"></nav>
    <div class="tw-rail-foot">
      Demonstration environment. Illustrative data only.
      <br /><a href="index.html#terminal-walkthrough">← Return to homepage</a>
    </div>
  </aside>
  <div class="tw-scrim" id="tw-scrim"></div>

  <div class="tw-main">
    <header class="tw-top">
      <button class="tw-menu" id="tw-menu" aria-label="Open module navigation" aria-controls="tw-rail" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="tw-crumb" id="tw-crumb"></div>
      <div class="tw-top-sp"></div>
      <div class="tw-search" role="search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="tw-q" type="search" placeholder="Search company, industry or city" autocomplete="off" aria-label="Search companies" aria-controls="tw-results" />
        <div class="tw-results" id="tw-results" hidden></div>
      </div>
      <button class="tw-theme" id="tw-theme" type="button" aria-label="Switch theme"></button>
      <a class="tw-exit" href="index.html#terminal-walkthrough" aria-label="Exit to homepage">Exit<span> to homepage</span></a>
    </header>

    <div class="tw-load" id="tw-load" aria-hidden="true"><i></i></div>

    <div class="tw-notice" role="note">
      <b>Demonstration data</b>
      <span id="tw-notice-txt"></span>
    </div>

    <main class="tw-view" id="tw-view" tabindex="-1"></main>

    <footer class="tw-tour" aria-label="Walkthrough navigation">
      <button class="btn" id="tw-prev">← Back</button>
      <div class="tw-tour-mid" id="tw-tour-mid"></div>
      <button class="btn primary" id="tw-next">Next →</button>
    </footer>
  </div>
</div>

<div id="tw-overlay"></div>
<div id="tw-print-root"></div>

<noscript><p style="padding:24px">The Climactix Terminal walkthrough requires JavaScript. <a href="index.html">Return to the homepage</a>.</p></noscript>

<script src="terminal-demo-data.js?v=1"></script>
<script src="terminal-impact-data.js?v=1"></script>
<script src="terminal-charts.js?v=1"></script>
<script src="terminal-geo-india.js?v=1"></script>
<script src="terminal-explainer.js?v=2"></script>
<script src="terminal-walkthrough.js?v=5"></script>
<script src="terminal-walkthrough-modules.js?v=5"></script>
<script src="terminal-walkthrough-audiences.js?v=4"></script>
<script src="terminal-walkthrough-impact.js?v=1"></script>
<script>window.CXT.start();</script>
</body>
</html>
