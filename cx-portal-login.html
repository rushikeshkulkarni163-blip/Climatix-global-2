<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="light dark" />
<title>Climactix Global — Internal Staff Access</title>
<meta http-equiv="refresh" content="0; url=climactix-staff-login.html" />
<script>(function(){var t=localStorage.getItem('cx-theme');if(t!=='dark')document.documentElement.setAttribute('data-theme','light');else document.documentElement.setAttribute('data-theme','dark');})()</script>
<style>
  :root{ --bg:#FFFFFF; --text:#111111; --text-2:#4F4F4F; --accent:#0B3D91; }
  [data-theme="dark"]{ --bg:#0B0E14; --text:#F4F6F8; --text-2:#B8C0CC; --accent:#3D7BE0; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Source Sans Pro',Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .msg{font-size:14px;color:var(--text-2);line-height:1.7}
  .msg a{color:var(--accent);font-weight:700;text-decoration:none}
  .msg a:hover{text-decoration:underline}
</style>
</head>
<body>
  <!--
    This page (the old "Internal Analyst System" login) was retired in
    favor of climactix-staff-login.html, which authenticates against real
    Firebase Auth + the cx_staff_v1 Firestore roster instead of the
    localStorage-only fake OTP flow this page used to run via cx-internal.js.
    Kept as a redirect (not deleted) so old bookmarks/links still land
    somewhere real, rather than 404ing.
  -->
  <div class="msg">
    This portal has moved.<br />
    Redirecting to <a href="climactix-staff-login.html">the Internal Staff Portal</a>…
  </div>
  <script>window.location.replace('climactix-staff-login.html');</script>
</body>
</html>
