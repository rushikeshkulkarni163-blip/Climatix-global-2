<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Fast Track Login</title></head>
<body style="background:#000;color:#fff;font-family:monospace;padding:40px">
  <p>Creating test session and redirecting…</p>
  <script src="enterprise.js"></script>
  <script>
    (function(){
      const E = window.ENTERPRISE;
      const company = E.createCompany({
        name: 'Meridian Steelworks',
        industryKey: 'manufacturing',
        country: 'India'
      });
      const rep = E.createRepresentative({
        companyId: company.id,
        name: 'Anjali Rao',
        email: 'anjali.rao@meridiansteel.example',
        role: 'sustainability_officer'
      });
      E.createSession(null, rep.id, company.id, 'sustainability_officer');
      window.location.href = 'enterprise-assessment.html';
    })();
  </script>
</body>
</html>
