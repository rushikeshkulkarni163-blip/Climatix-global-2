version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: climactix-postgres
    restart: unless-stopped
    env_file: ./backend/.env.prod
    environment:
      POSTGRES_USER: climactix
      POSTGRES_DB: climactix
      # POSTGRES_PASSWORD comes from ./backend/.env.prod (env_file above) —
      # set it there, and make sure DATABASE_URL in the same file uses the
      # identical password and host "postgres" (the Compose service name,
      # NOT localhost — localhost inside the api container means the api
      # container itself, which is what caused this to be broken).
    volumes:
      - climactix-pgdata:/var/lib/postgresql/data
    networks:
      - climactix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climactix -d climactix"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: climactix-api
    restart: unless-stopped
    env_file: ./backend/.env.prod
    volumes:
      - ./backend/knowledge:/app/knowledge
    networks:
      - climactix-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: climactix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - climactix-net

networks:
  climactix-net:
    driver: bridge

volumes:
  climactix-pgdata:
