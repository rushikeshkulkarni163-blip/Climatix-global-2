# Climactix Terminal — PostgreSQL, API, worker.
#   cp .env.example .env   (set TERMINAL_JWT_SECRET and POSTGRES_PASSWORD)
#   docker compose up -d --build
#   docker compose exec api python -m cxt.cli create-admin --email you@yourorg.com --name "Your Name"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: climactix_terminal
      POSTGRES_USER: cxt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cxt -d climactix_terminal"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      TERMINAL_DATABASE_URL: postgresql+psycopg://cxt:${POSTGRES_PASSWORD}@db/climactix_terminal
    volumes: [documents:/data/documents]
    ports: ["8100:8100"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      TERMINAL_DATABASE_URL: postgresql+psycopg://cxt:${POSTGRES_PASSWORD}@db/climactix_terminal
    volumes: [documents:/data/documents]
    command: ["python", "-m", "cxt.cli", "worker"]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  db-data:
  documents:
