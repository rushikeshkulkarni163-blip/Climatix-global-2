<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="light dark" />
<title>Climactix — Institutional Report Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="Climatix_logo.png" />
<script>(function(){var t=localStorage.getItem('cx-theme');if(t!=='dark')document.documentElement.setAttribute('data-theme','light');else document.documentElement.setAttribute('data-theme','dark');})()</script>
<style>
:root{
  --bg:#FFFFFF; --surface:#FAFAFA; --surface-2:#F0F1F3; --surface-3:#E7E9EC;
  --border:#D9D9D9; --border-strong:#BFC5CC;
  --text:#111111; --text-2:#4F4F4F; --text-muted:#6B7280;
  --accent:#0B3D91; --accent-fill:#0B3D91;
  --success:#1E8E3E; --warning:#B45309; --critical:#DC2626;
  --font-heading:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-body:'Source Sans Pro',Arial,sans-serif;
  --font-report:'Merriweather',Georgia,serif;
  --t:0.18s ease; --radius:8px; --pill:999px;
}
[data-theme="dark"]{
  --bg:#0B0E14; --surface:#11151C; --surface-2:#161B24; --surface-3:#1C222C;
  --border:#232935; --border-strong:#2E3644;
  --text:#F4F6F8; --text-2:#B8C0CC; --text-muted:#7C8794;
  --accent:#3D7BE0; --accent-fill:#0B3D91;
  --success:#22C55E; --warning:#F59E0B; --critical:#F87171;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:13px;line-height:1.5;min-height:100vh}
.mono{font-family:var(--font-heading);font-variant-numeric:tabular-nums}
.prose{font-family:var(--font-report);line-height:1.8}
/* Nav */
.nav{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:200}
.nav-left{display:flex;align-items:center;gap:10px}
.nav-logo{font-family:var(--font-heading);font-size:13px;font-weight:700;letter-spacing:-0.01em}
.nav-badge{font-family:var(--font-heading);font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);padding:2px 8px;border-radius:var(--pill);border:1px solid var(--border);background:var(--surface)}
.nav-right{display:flex;align-items:center;gap:8px}
.nav-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:5px 11px;font-family:var(--font-heading);font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all var(--t);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn.accent{border-color:rgba(11,61,145,0.3);color:var(--accent)}
.nav-btn.accent:hover{background:rgba(11,61,145,0.06)}
.analyst-badge{display:flex;align-items:center;gap:6px;padding:3px 9px;background:var(--surface);border:1px solid var(--border);border-radius:var(--pill)}
.analyst-badge-id{font-family:var(--font-heading);font-size:10px;font-weight:700;color:var(--accent)}
.analyst-badge-name{font-size:11px;color:var(--text-2)}
/* Workspace */
.workspace{display:grid;grid-template-columns:220px 1fr}
/* Sidebar */
.sidebar{border-right:1px solid var(--border);position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
.sb-report-meta{padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.sb-meta-label{font-family:var(--font-heading);font-size:10px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
.sb-report-id{font-family:var(--font-heading);font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.sb-company-name{font-size:13px;font-weight:700;margin-bottom:4px}
.sb-rating-display{display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)}
.sb-rating-num{font-family:var(--font-heading);font-size:24px;font-weight:700;letter-spacing:-0.02em}
.sb-rating-grade{font-family:var(--font-heading);font-size:13px;font-weight:700}
.sb-nav-label{font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-muted);padding:8px 14px 4px}
.sb-nav-link{display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:12px;color:var(--text-2);text-decoration:none;cursor:pointer;transition:all var(--t);border-left:2px solid transparent}
.sb-nav-link:hover{color:var(--text);background:var(--surface)}
.sb-nav-link.active{color:var(--accent);border-left-color:var(--accent);background:rgba(11,61,145,0.05)}
.sb-section-num{font-family:var(--font-heading);font-size:11px;font-weight:700;color:var(--text-muted);flex-shrink:0;width:16px}
/* Main */
.main{overflow-x:hidden}
/* Cover page */
.cover-page{padding:32px;border-bottom:2px solid var(--border-strong);background:var(--surface)}
.cover-label{font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.cover-title{font-size:26px;font-weight:700;letter-spacing:-0.01em;margin-bottom:4px;text-wrap:balance}
.cover-subtitle{font-size:14px;font-weight:400;color:var(--text-2);margin-bottom:24px}
.cover-grid{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}
.cover-entity{display:flex;flex-direction:column;gap:8px}
.cover-cx-id{font-family:var(--font-heading);font-size:13px;font-weight:700;color:var(--accent)}
.cover-company{font-size:20px;font-weight:700;letter-spacing:-0.01em}
.cover-meta-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.cover-meta-item{font-size:11px;color:var(--text-2)}
.cover-meta-item strong{color:var(--text);font-weight:600}
.cover-rating-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;text-align:center;min-width:140px}
.cover-rating-num{font-family:var(--font-heading);font-size:36px;font-weight:700;letter-spacing:-0.02em;line-height:1}
.cover-rating-grade{font-family:var(--font-heading);font-size:14px;font-weight:700;margin-top:4px}
.cover-rating-desc{font-size:11px;color:var(--text-2);margin-top:4px}
.cover-footer{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.cover-footer-left{font-size:11px;color:var(--text-muted)}
.cover-generated{font-family:var(--font-heading);font-size:10px;color:var(--text-muted)}
/* Report sections */
.report-section{border-bottom:1px solid var(--border);scroll-margin-top:52px}
.report-section-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:52px;z-index:10}
.rs-num{font-family:var(--font-heading);font-size:11px;font-weight:700;color:var(--text-muted);margin-right:10px;flex-shrink:0}
.rs-title{font-family:var(--font-heading);font-size:13px;font-weight:700;color:var(--text)}
.rs-meta{font-family:var(--font-heading);font-size:10px;color:var(--text-muted)}
.report-body{padding:20px 24px}
/* Data grids */
.data-grid{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:16px;border-radius:var(--radius);overflow:hidden}
.data-grid-2{grid-template-columns:1fr 1fr}
.data-grid-3{grid-template-columns:1fr 1fr 1fr}
.data-grid-4{grid-template-columns:1fr 1fr 1fr 1fr}
.dg-cell{background:var(--bg);padding:12px 14px}
.dg-label{font-family:var(--font-heading);font-size:10px;font-weight:500;letter-spacing:0.03em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
.dg-val{font-size:14px;font-weight:700;color:var(--text)}
.dg-val.mono{font-family:var(--font-heading);font-size:15px;letter-spacing:-0.01em}
.dg-val.large{font-family:var(--font-heading);font-size:22px;font-weight:700;letter-spacing:-0.02em}
.dg-sub{font-size:11px;color:var(--text-2);margin-top:3px}
/* C-Layer report grid */
.clayer-report{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);margin-bottom:16px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.clr-cell{background:var(--bg);padding:12px 14px}
.clr-label{font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.02em;margin-bottom:2px}
.clr-long{font-size:11px;color:var(--text-2);margin-bottom:6px}
.clr-score{font-family:var(--font-heading);font-size:20px;font-weight:700;letter-spacing:-0.02em}
.clr-weight{font-size:11px;color:var(--text-muted);margin-top:2px}
.clr-status{font-family:var(--font-heading);font-size:10px;font-weight:700;margin-top:4px}
.clr-bar{height:4px;background:var(--border);margin-top:6px;border-radius:2px}
.clr-bar-fill{height:100%;border-radius:2px;transition:width 0.25s ease}
/* Framework compliance table */
.fw-report-table{width:100%;border-collapse:collapse}
.fw-report-table thead th{font-family:var(--font-heading);font-size:11px;font-weight:700;color:var(--text-muted);padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;background:var(--surface)}
.fw-report-table tbody tr{border-bottom:1px solid var(--border)}
.fw-report-table tbody tr:hover{background:var(--surface)}
.fw-report-table td{padding:8px 12px;font-size:12px}
.fw-bar{width:80px;height:4px;background:var(--border);border-radius:2px;display:inline-block;vertical-align:middle;margin-right:6px}
.fw-bar-fill{height:100%;border-radius:2px}
/* Recommendation lists */
.rec-list{list-style:none;padding:0}
.rec-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.rec-item:last-child{border-bottom:none}
.rec-bullet{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px}
.rec-text{font-family:var(--font-report);font-size:13px;line-height:1.7}
/* Key findings */
.findings-list{padding:0;list-style:none}
.finding-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.finding-item:last-child{border-bottom:none}
.finding-arrow{color:var(--accent);font-size:11px;flex-shrink:0;margin-top:3px;font-family:var(--font-heading)}
.finding-text{font-family:var(--font-report);font-size:13px;line-height:1.7}
/* Greenwashing risk bar */
.gw-bar-container{margin:12px 0}
.gw-bar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden;position:relative}
.gw-bar-fill{height:100%;border-radius:4px;transition:width 0.25s ease}
.gw-bar-labels{display:flex;justify-content:space-between;margin-top:4px}
.gw-bar-label{font-family:var(--font-heading);font-size:10px;color:var(--text-muted)}
/* Chips */
.chip{display:inline-flex;padding:3px 10px;border-radius:var(--pill);font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.02em;white-space:nowrap}
.chip-green{background:rgba(30,142,62,0.08);border:1px solid rgba(30,142,62,0.25);color:var(--success)}
.chip-amber{background:rgba(180,83,9,0.08);border:1px solid rgba(180,83,9,0.25);color:var(--warning)}
.chip-red{background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.25);color:var(--critical)}
.chip-cyan{background:rgba(11,61,145,0.07);border:1px solid rgba(11,61,145,0.25);color:var(--accent)}
/* Divider */
.report-divider{height:1px;background:var(--border);margin:16px 0}
/* Status row */
.status-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.status-row:last-child{border-bottom:none}
.sr-label{font-size:12px;color:var(--text-2)}
.sr-val{font-family:var(--font-heading);font-size:11px;font-weight:700}
/* Confidence meter */
.confidence-meter{margin:12px 0}
.cm-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.cm-fill{height:100%;border-radius:3px;transition:width 0.25s ease}
/* Print styles */
@media print {
  .nav,.sidebar,.print-hide{display:none!important}
  .workspace{display:block}
  .main{display:block;width:100%}
  body{background:#fff;color:#111111;font-size:10pt}
  :root{--bg:#fff;--surface:#FAFAFA;--text:#111111;--text-2:#4F4F4F;--text-muted:#6B7280;--border:#D9D9D9;--border-strong:#BFC5CC}
  .cover-page{padding:20pt}
  .report-section-hdr{position:static;background:var(--surface);page-break-inside:avoid}
  .report-section{page-break-inside:avoid}
  .report-body{padding:12pt 20pt}
}
/* Empty state */
.empty-state{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13px}
/* Assessment selector */
.company-card{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all var(--t);margin-bottom:6px}
.company-card:hover{border-color:rgba(11,61,145,0.3);background:rgba(11,61,145,0.03)}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>
<header class="nav">
  <div class="nav-left">
    <img src="Climatix_logo.png" alt="Climactix Global" style="height:20px;width:auto;display:block" />
    <span class="nav-logo">Climactix Global</span>
    <span class="nav-badge">Report engine</span>
  </div>
  <div class="nav-right">
    <span class="mono" style="font-size:11px;color:var(--text-muted)" id="nav-time">--:-- UTC</span>
    <div class="analyst-badge">
      <span class="analyst-badge-id mono" id="nav-analyst-id">—</span>
      <span class="analyst-badge-name" id="nav-analyst-name">—</span>
    </div>
    <a href="cx-portal-dashboard.html" class="nav-btn">Dashboard</a>
    <a href="cx-portal-dashboard.html#queue" class="nav-btn">Review queue</a>
    <button class="nav-btn accent print-hide" id="printBtn">Print report</button>
    <button class="nav-btn print-hide" id="signOutBtn">Sign out</button>
  </div>
</header>
<div class="workspace">
  <nav class="sidebar print-hide">
    <div class="sb-report-meta">
      <div class="sb-meta-label">Report</div>
      <div class="sb-report-id mono" id="sb-report-id">—</div>
      <div class="sb-company-name" id="sb-company-name">—</div>
      <div class="sb-rating-display" id="sb-rating-display">
        <div>
          <div class="sb-rating-num mono" id="sb-rating-num" style="color:var(--accent)">—</div>
          <div style="font-size:10px;color:var(--text-muted)">C-Score</div>
        </div>
        <div>
          <div class="sb-rating-grade mono" id="sb-rating-grade" style="color:var(--accent)">—</div>
          <div style="font-size:10px;color:var(--text-muted)">Rating</div>
        </div>
      </div>
    </div>
    <div style="padding:6px 0">
      <div class="sb-nav-label">Sections</div>
      <div id="sb-section-links"></div>
      <div class="sb-nav-label" style="margin-top:4px">Actions</div>
      <div class="sb-nav-link" id="printLink" style="cursor:pointer">Print / export</div>
      <div class="sb-nav-link" id="saveReportLink" style="cursor:pointer">Save report</div>
      <a class="sb-nav-link" href="cx-portal-dashboard.html#queue" id="sb-review-link">Review queue</a>
      <a class="sb-nav-link" href="cx-portal-dashboard.html">Dashboard</a>
    </div>
  </nav>
  <div class="main" id="main-content">
    <div class="empty-state" id="loading-state">Loading report data…</div>
  </div>
</div>
<script type="module">
import { getSession, signOut } from './auth.js';
import * as RiskOSData from './risk-os-data.js';

const $ = id => document.getElementById(id);

// ── Auth guard — Backend-team-only tool ──
const session = getSession();
if (!session?.verified) { window.location.href = 'climactix-staff-login.html'; await new Promise(() => {}); }
const isStaff = await RiskOSData.checkClimactixStaff();
if (!isStaff) { await signOut(); window.location.href = 'climactix-staff-login.html'; await new Promise(() => {}); }

function updateClock() { const n = new Date(); $('nav-time').textContent = `${String(n.getUTCHours()).padStart(2, '0')}:${String(n.getUTCMinutes()).padStart(2, '0')} UTC`; }
updateClock(); setInterval(updateClock, 60000);
$('nav-analyst-id').textContent = session.uid.slice(0, 10);
$('nav-analyst-name').textContent = session.fullName || session.email || 'Analyst';

async function doSignOut() { await signOut(); window.location.href = 'climactix-staff-login.html'; }
$('signOutBtn').addEventListener('click', doSignOut);
$('printBtn').addEventListener('click', () => window.print());
$('printLink').addEventListener('click', () => window.print());

// Reads the LIVE value of a v4.0 design token so JS-computed colors (score
// bands, risk bands) stay correct in both light and dark theme.
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// C-LAYER pillar colors compressed onto the 4 sanctioned v4.0 tokens
// (accent + success/warning/critical) instead of an 8-color decorative rainbow.
function C_LAYERS() {
  return [
    { id: 'c_core', label: 'C-CORE', long: 'Governance & Strategy', color: cssVar('--accent') },
    { id: 'c_fin', label: 'C-FIN', long: 'Financial Materiality', color: cssVar('--accent') },
    { id: 'c_risk_p', label: 'C-RISK/P', long: 'Physical Risk Exposure', color: cssVar('--warning') },
    { id: 'c_risk_t', label: 'C-RISK/T', long: 'Transition Risk Exposure', color: cssVar('--warning') },
    { id: 'c_capital', label: 'C-CAPITAL', long: 'Carbon & Capital Allocation', color: cssVar('--accent') },
    { id: 'c_supply', label: 'C-SUPPLY', long: 'Supply Chain Fragility', color: cssVar('--accent') },
    { id: 'c_adapt', label: 'C-ADAPT', long: 'Adaptation & Resilience', color: cssVar('--success') },
    { id: 'c_truth', label: 'C-TRUTH', long: 'Disclosure Integrity', color: cssVar('--critical') },
  ];
}
function ratingFor(score) {
  const bands = [
    { grade: 'AAA-C', min: 90, color: cssVar('--success'), desc: 'Institutional-grade climate resilience' },
    { grade: 'AA-C', min: 80, color: cssVar('--success'), desc: 'Strong climate positioning' },
    { grade: 'A-C', min: 70, color: cssVar('--success'), desc: 'Sound climate management' },
    { grade: 'BBB-C', min: 60, color: cssVar('--accent'), desc: 'Adequate climate governance' },
    { grade: 'BB-C', min: 50, color: cssVar('--accent'), desc: 'Developing climate capability' },
    { grade: 'B-C', min: 35, color: cssVar('--warning'), desc: 'Material climate risk exposure' },
    { grade: 'CCC-C', min: 0, color: cssVar('--critical'), desc: 'Elevated climate risk — limited mitigation evidence' },
  ];
  if (score == null) return { grade: 'N/R', color: cssVar('--text-muted'), desc: 'Not yet scored' };
  return bands.find(b => score >= b.min) || bands[bands.length - 1];
}
function statusForScore(score) {
  if (score == null) return { label: 'Not scored', color: 'var(--text-muted)' };
  if (score >= 80) return { label: 'Strong', color: 'var(--success)' };
  if (score >= 60) return { label: 'Adequate', color: 'var(--accent)' };
  if (score >= 40) return { label: 'Developing', color: 'var(--warning)' };
  return { label: 'Weak', color: 'var(--critical)' };
}
function dgCell(label, val, sub, color) {
  return `<div class="dg-cell"><div class="dg-label">${label}</div><div class="dg-val mono" style="color:${color || 'var(--text)'}">${val ?? '—'}</div>${sub ? `<div class="dg-sub">${sub}</div>` : ''}</div>`;
}
function noData() { return '<div style="font-size:12px;color:var(--text-muted);padding:8px 0">No data available for this section.</div>'; }
function showToast(msg, type = '') {
  let t = $('rg-toast');
  if (!t) { t = document.createElement('div'); t.id = 'rg-toast'; t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card,#fff);border:1px solid var(--border-strong);padding:8px 16px;font-family:var(--font-heading);font-size:12px;font-weight:700;color:var(--text);border-radius:8px;z-index:9999;opacity:0;transition:opacity 0.2s ease;pointer-events:none'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = '1'; t.style.color = type === 'green' ? 'var(--success)' : type === 'red' ? 'var(--critical)' : 'var(--text)';
  setTimeout(() => { t.style.opacity = '0'; }, 2500);
}

// ── Load params ──
const params = new URLSearchParams(window.location.search);
const assessmentIdParam = params.get('assessment');
const reportIdParam = params.get('report');

if (!assessmentIdParam && !reportIdParam) {
  $('main-content').innerHTML = await buildAssessmentSelector();
  throw new Error('no-target-selected'); // benign — page already rendered, halts the rest of this module
}

let savedSnapshot = null; // set when loaded via ?report= — a frozen point-in-time reportData
if (reportIdParam) {
  savedSnapshot = await new Promise(res => { const u = RiskOSData.subscribeReport(reportIdParam, data => { u(); res(data); }); });
  if (!savedSnapshot) {
    $('main-content').innerHTML = `<div class="empty-state">Report ${reportIdParam} not found. <a href="cx-portal-dashboard.html" style="color:var(--accent)">Return to Command Center</a></div>`;
    throw new Error('report-not-found');
  }
}

async function buildAssessmentSelector() {

// ── Assemble reportData from either a live assessment or a saved snapshot ──
async function assembleLiveReportData(assessmentId) {
  const [assessments, companies, clayerScores, entityIntel, contradictionFlags, claims, answers, questionBank, evidence] = await Promise.all([
    new Promise(res => { const u = RiskOSData.subscribeAllAssessmentsForStaff(items => { u(); res(items); }); }),
    new Promise(res => { const u = RiskOSData.subscribeAllCompaniesForStaff(items => { u(); res(items); }); }),
    new Promise(res => { const u = RiskOSData.subscribeClayerScores(assessmentId, items => { u(); res(items); }); }),
    new Promise(res => { const u = RiskOSData.subscribeEntityIntelligence(assessmentId, data => { u(); res(data); }); }),
    new Promise(res => { const u = RiskOSData.subscribeContradictionFlags(assessmentId, items => { u(); res(items); }); }),
    new Promise(res => { const u = RiskOSData.subscribeAllClaimsForAssessment(assessmentId, items => { u(); res(items); }); }),
    new Promise(res => { const u = RiskOSData.subscribeAnswers(assessmentId, byQ => { u(); res(byQ); }); }),
    RiskOSData.loadQuestionBank(),
    new Promise(res => { const u = RiskOSData.subscribeAllEvidence(assessmentId, items => { u(); res(items); }); }),
  ]);
  const assessment = assessments.find(a => a.id === assessmentId);
  if (!assessment) return null;
  const company = companies.find(c => c.id === assessment.companyId) || null;
  const clayers = C_LAYERS();

  const fwCoverage = {};
  questionBank.forEach(q => {
    (q.fw || []).forEach(code => {
      fwCoverage[code] = fwCoverage[code] || { total: 0, answered: 0 };
      fwCoverage[code].total++;
      if (answers[q.id] != null && answers[q.id] !== '') fwCoverage[code].answered++;
    });
  });
  const frameworkCoverage = Object.entries(fwCoverage).map(([code, d]) => ({ code, total: d.total, answered: d.answered, pct: Math.round((d.answered / d.total) * 100) })).sort((a, b) => b.total - a.total);

  const metricClaims = claims.filter(c => c.kind === 'metric');
  const uniqueMetrics = [...new Map(metricClaims.map(m => [m.metric, m])).values()].map(m => ({ metric: m.metric, value: m.value, unit: m.unit || '' }));

  const verifiedEvidenceCount = evidence.filter(e => e.reviewStatus === 'verified').length;

  return {
    assessmentId, companyId: assessment.companyId,
    companyName: company?.name || 'Unknown company', sector: company?.sector || null,
    hqCountry: company?.hqCountry || null, jurisdictions: company?.jurisdictions || [],
    year: assessment.year, overallScore: assessment.overallScore, rating: assessment.rating, status: assessment.status,
    clayerScores: clayers.map(cl => {
      const row = clayerScores.find(c => c.clayerId === cl.id);
      return { id: cl.id, label: cl.label, long: cl.long, color: cl.color, score: row?.climactixScore ?? null, weight: row?.weight ?? null };
    }),
    greenwashingRisk: entityIntel?.greenwashingRisk || null,
    evidenceIntegrityScore: entityIntel?.evidenceIntegrityScore ?? null,
    disclosureConsistencyScore: entityIntel?.disclosureConsistencyScore ?? null,
    verificationCoveragePct: entityIntel?.verificationCoveragePct ?? null,
    verifiedClaims: entityIntel?.verifiedClaims ?? 0, partiallyVerifiedClaims: entityIntel?.partiallyVerifiedClaims ?? 0,
    unsupportedClaims: entityIntel?.unsupportedClaims ?? 0, contradictoryClaims: entityIntel?.contradictoryClaims ?? 0,
    contradictionFlags: contradictionFlags.map(c => ({ ruleId: c.ruleId, severity: c.severity, summary: c.summary })),
    quantMetrics: uniqueMetrics,
    frameworkCoverage,
    evidenceCount: evidence.length, verifiedEvidenceCount,
    questionsAnswered: Object.keys(answers).length, questionsTotal: questionBank.length,
    generatedAtDisplay: new Date().toLocaleString(),
  };
}

function buildRecommendations(d) {
  const immediate = [], shortTerm = [], longTerm = [];
  d.clayerScores.forEach(cl => {
    if (cl.score != null && cl.score < 40) immediate.push(`${cl.long} (${cl.label}) scored ${cl.score}/100 — material weakness requiring near-term remediation.`);
    else if (cl.score != null && cl.score < 60) shortTerm.push(`${cl.long} (${cl.label}) scored ${cl.score}/100 — strengthen disclosure and controls over the next reporting cycle.`);
  });
  if (d.greenwashingRisk === 'HIGH' || d.greenwashingRisk === 'ELEVATED') immediate.push(`Greenwashing risk is assessed as ${d.greenwashingRisk} — review flagged claims and contradictions before external disclosure.`);
  if (d.contradictoryClaims > 0) immediate.push(`${d.contradictoryClaims} claim(s) are contradicted by cross-document evidence — resolve before finalizing this assessment.`);
  if (d.unsupportedClaims > 0) shortTerm.push(`${d.unsupportedClaims} claim(s) remain unsupported by verifiable evidence — request additional documentation.`);
  d.frameworkCoverage.filter(f => f.pct < 50).forEach(f => longTerm.push(`${f.code} framework coverage is ${f.pct}% — expand disclosure to close this gap.`));
  if (!immediate.length && !shortTerm.length && !longTerm.length) longTerm.push('No material gaps identified from current C-LAYER scores, evidence verification, or framework coverage.');
  return { immediate, shortTerm, longTerm };
}

function buildSections(d) {
  const recs = buildRecommendations(d);
  const sections = [
    { id: 'exec', shortTitle: 'Executive Summary', fn: () => renderExecSummary(d) },
    { id: 'rating', shortTitle: 'Institutional Rating', fn: () => renderRating(d) },
  ];
  C_LAYERS().forEach(cl => {
    const clData = d.clayerScores.find(c => c.id === cl.id);
    sections.push({ id: cl.id, shortTitle: cl.long, fn: () => renderPillar(clData, cl.id === 'c_truth' ? d : (cl.id === 'c_capital' ? d : null)) });
  });
  sections.push(
    { id: 'fw', shortTitle: 'Framework Compliance', fn: () => renderFrameworkCompliance(d) },
    { id: 'recs', shortTitle: 'Recommendations', fn: () => renderRecommendations(recs) },
    { id: 'evidence', shortTitle: 'Evidence Reliability', fn: () => renderEvidence(d) },
    { id: 'conf', shortTitle: 'Confidence & Methodology', fn: () => renderConfidence(d) },
  );
  return sections;
}

      <span class="chip chip-amber mono">${entityD.unsupportedClaims} unsupported</span>

      <div class="cover-footer-left">
        <div>Climactix Global Intelligence Platform — Confidential</div>
        <div style="margin-top:2px;color:var(--text-muted)">Assessment: ${d.assessmentId}${reportId ? ` &middot; Report: ${reportId}` : ''}</div>
      </div>
      <div class="cover-generated mono">Generated ${d.generatedAtDisplay}</div>
    </div>
  </div>`;
}

function buildPage() {
  const rating = ratingFor(reportData.overallScore);
  $('sb-report-id').textContent = reportId || reportData.assessmentId.slice(0, 12);
  $('sb-company-name').textContent = reportData.companyName;
  $('sb-rating-num').textContent = reportData.overallScore ?? '—';
  $('sb-rating-num').style.color = rating.color;
  $('sb-rating-grade').textContent = reportData.overallScore ? rating.grade : '—';
  $('sb-rating-grade').style.color = rating.color;
  $('sb-review-link').href = `cx-review-workspace.html?assessment=${reportData.assessmentId}`;

  const sections = buildSections(reportData);
  $('sb-section-links').innerHTML = sections.map((s, i) => `<div class="sb-nav-link" onclick="window.scrollToSection('rs-${s.id}')" style="cursor:pointer"><span class="sb-section-num">${String(i).padStart(2, '0')}</span>${s.shortTitle}</div>`).join('');

  let html = buildCoverPage(reportData);
  sections.forEach((s, i) => {
    html += `<div class="report-section" id="rs-${s.id}">
      <div class="report-section-hdr">
        <div style="display:flex;align-items:center"><span class="rs-num">${String(i + 1).padStart(2, '0')}</span><span class="rs-title">${s.shortTitle}</span></div>
        <span class="rs-meta">${reportData.assessmentId.slice(0, 10)}</span>
      </div>
      <div class="report-body">${s.fn()}</div>
    </div>`;
  });
  $('main-content').innerHTML = html;
}
window.scrollToSection = function (id) { const el = $(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

buildPage();
</script>
  <!-- Card micro-interaction engine (hover lift/tilt, entrance reveal) -->
  <script src="card-motion.js" defer></script>
</body>
</html>
